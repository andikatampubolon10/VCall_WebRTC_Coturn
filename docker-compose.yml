services:
  coturn:
    image: coturn/coturn:latest
    container_name: coturn-simulasi
    restart: unless-stopped
    ports:
      # Port STUN/TURN default
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # Rentang Port Relay (UDP) untuk mendukung hingga 100+ concurrent user
      - "49160-49400:49160-49400/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"

